name: Build Android app

# Builds the signed Play Store bundle (.aab) and an installable test .apk.
# Runs on every push to main, and on demand (Actions tab > Build Android app > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_PASSWORD != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare error reporting
        run: |
          cat > "$RUNNER_TEMP/run.sh" <<'SH'
          #!/usr/bin/env bash
          # run.sh <label> <command...>: run, keep a log, and on failure show the last lines as an annotation
          label="$1"; shift
          set -o pipefail
          "$@" 2>&1 | tee "$RUNNER_TEMP/step.log"; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            msg=$( (grep -iE "error|failed|what went wrong|exception|cannot|could not" "$RUNNER_TEMP/step.log" | grep -v "^\s*at " | tail -12; echo ---; tail -8 "$RUNNER_TEMP/step.log") | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=$label failed::$msg"
          fi
          exit $rc
          SH
          chmod +x "$RUNNER_TEMP/run.sh"
          echo "RUN=$RUNNER_TEMP/run.sh" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -6

      - name: Refresh the offline copy of the concert list from the website
        run: |
          set +e
          for base in https://kutcheri-dec.netlify.app https://raw.githubusercontent.com/sunithi2000-lab/kutcheri/main; do
            curl -fsSL "$base/data/concerts.json" -o /tmp/c.json && curl -fsSL "$base/data/organisations.json" -o /tmp/o.json \
              && python3 -c "import json; assert json.load(open('/tmp/c.json')) and json.load(open('/tmp/o.json'))" \
              && cp /tmp/c.json data/concerts.json && cp /tmp/o.json data/organisations.json && echo "data from $base" && break
          done
          true

      - name: Build app page
        run: $RUN "Build app page" bash -c 'python3 tools/build_www.py && node --check tools/_check.js'

      - name: Install Capacitor
        run: $RUN "npm install" npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          $RUN "cap add android" npx cap add android
          $RUN "icons" npx capacitor-assets generate --android --iconBackgroundColor '#0E6A57' --iconBackgroundColorDark '#0E6A57' --splashBackgroundColor '#0E6A57' --splashBackgroundColorDark '#0E6A57'
          $RUN "patch android" python3 scripts/patch_android.py
          $RUN "cap sync" npx cap sync android

      - name: Build signed bundle and APK
        if: env.HAS_KEY == 'yes'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing/upload-key.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          $RUN "gradle release build" ./gradlew --no-daemon bundleRelease assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/bundle/release/app-release.aab "../dist/kutcheri-planner-1.0.${VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "../dist/kutcheri-planner-1.0.${VERSION_CODE}.apk"
          ls -l ../dist

      - name: Build test APK only (signing password not set up yet)
        if: env.HAS_KEY != 'yes'
        working-directory: android
        run: |
          echo "::warning::Repository secret KEYSTORE_PASSWORD is not set, so only a debug test APK was built (not uploadable to Google Play)."
          chmod +x gradlew
          $RUN "gradle debug build" ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/kutcheri-planner-1.0.${VERSION_CODE}-test.apk"

      - name: Check the built app
        run: |
          apk=$(ls dist/*.apk | head -1)
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          badging=$("$aapt" dump badging "$apk" | grep -E "^package:|^targetSdkVersion|^sdkVersion|^application-label:|^application-icon-640" | tr '\n' ' ')
          files=$(unzip -l "$apk" | awk '{print $4}')
          for f in assets/public/index.html assets/public/icon.svg assets/capacitor.config.json; do
            echo "$files" | grep -qx "$f" || { echo "::error::missing $f in APK"; exit 1; }
          done
          icons=$(echo "$files" | grep -c "res/mipmap" || true)
          echo "::notice title=App built::$(basename "$apk") $(du -h "$apk" | cut -f1) | $badging| mipmap files: $icons | $(ls dist | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: kutcheri-planner-1.0.${{ github.run_number }}
          path: dist/*

      - name: Publish as a GitHub release
        if: env.HAS_KEY == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${VERSION_CODE}" dist/* \
            --title "Kutcheri Planner 1.0.${VERSION_CODE}" \
            --notes "Upload the .aab to Google Play Console. The .apk installs directly on an Android phone for testing."
