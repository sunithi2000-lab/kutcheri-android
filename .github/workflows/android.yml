name: Build Android app

# Builds the signed Play Store bundle (.aab) and an installable test .apk.
# Runs on every push to main, and on demand (Actions tab > Build Android app > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_PASSWORD != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Refresh the offline copy of the concert list from the website
        run: |
          set +e
          for base in https://kutcheri-dec.netlify.app https://raw.githubusercontent.com/sunithi2000-lab/kutcheri/main; do
            curl -fsSL "$base/data/concerts.json" -o /tmp/c.json && curl -fsSL "$base/data/organisations.json" -o /tmp/o.json \
              && python3 -c "import json; assert json.load(open('/tmp/c.json')) and json.load(open('/tmp/o.json'))" \
              && cp /tmp/c.json data/concerts.json && cp /tmp/o.json data/organisations.json && echo "data from $base" && break
          done
          true

      - name: Build app page
        run: python3 tools/build_www.py && node --check tools/_check.js

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0E6A57' --iconBackgroundColorDark '#0E6A57' --splashBackgroundColor '#0E6A57' --splashBackgroundColorDark '#0E6A57'
          python3 scripts/patch_android.py
          npx cap sync android

      - name: Build signed bundle and APK
        if: env.HAS_KEY == 'yes'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing/upload-key.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/bundle/release/app-release.aab "../dist/kutcheri-planner-1.0.${VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "../dist/kutcheri-planner-1.0.${VERSION_CODE}.apk"
          ls -l ../dist

      - name: Build test APK only (signing password not set up yet)
        if: env.HAS_KEY != 'yes'
        working-directory: android
        run: |
          echo "::warning::Repository secret KEYSTORE_PASSWORD is not set, so only a debug test APK was built (not uploadable to Google Play)."
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/kutcheri-planner-1.0.${VERSION_CODE}-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kutcheri-planner-1.0.${{ github.run_number }}
          path: dist/*

      - name: Publish as a GitHub release
        if: env.HAS_KEY == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${VERSION_CODE}" dist/* \
            --title "Kutcheri Planner 1.0.${VERSION_CODE}" \
            --notes "Upload the .aab to Google Play Console. The .apk installs directly on an Android phone for testing."
